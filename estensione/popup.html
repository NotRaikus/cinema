<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, 'Noto Sans Thai', sans-serif; background: #1a1622; color: #f4f0f8; display: grid; gap: 12px; }
  h1 { font-size: 16px; margin: 0; }
  label { display: grid; gap: 4px; color: #a99fb8; font-size: 12px; }
  select, input[type=password], input[type=text] { font: inherit; background: #262031; color: #f4f0f8; border: 1px solid #3a3147; border-radius: 8px; padding: 7px 9px; }
  .check { display: flex; gap: 8px; align-items: center; color: #f4f0f8; font-size: 13px; }
  .note { color: #a99fb8; font-size: 12px; margin: 0; }
  .box { background: #000; border-radius: 8px; padding: 8px; min-height: 20px; white-space: pre-line; font-size: 13px; color: #f4f0f8; }
  #claudeBox[hidden] { display: none; }
</style>
</head>
<body>
  <h1 data-i="title"></h1>
  <label><span data-i="engine"></span>
    <select id="engine">
      <option value="google" data-i="free"></option>
      <option value="claude" data-i="claude"></option>
    </select>
  </label>
  <div id="claudeBox">
    <label><span data-i="key"></span> <input id="apiKey" type="password" placeholder="sk-ant-..."></label>
    <label><span data-i="model"></span> <input id="model" type="text"></label>
    <p class="note" data-i="modelNote"></p>
  </div>
  <label class="check"><input id="hideOriginal" type="checkbox"> <span data-i="hide"></span></label>
  <label><span data-i="langs"></span><div class="box" id="langs">—</div></label>
  <label><span data-i="last"></span><div class="box" id="last">—</div></label>
  <p class="note" data-i="tip"></p>
  <script src="popup.js"></script>
</body>
</html>
